services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: smash
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD}
      POSTGRES_DB: smash
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smash -d smash"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: smash
      DB_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD}
      DB_NAME: smash
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET}
      JWT_EXPIRES_IN: 12h
      TRUST_PROXY: "true"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-3000}:3000"

  web:
    build:
      context: ./frontend
      dockerfile: web/Dockerfile
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  db-data:
